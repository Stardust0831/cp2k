name: build-and-guard

on:
  workflow_dispatch:
  push:
    branches: [feat-ot-kpoints]

jobs:
  build:
    name: Toolchain + build (ssmp, psmp) + guard
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo bash ./tools/toolchain/install_requirements_ubuntu.sh

      - name: Restore toolchain cache
        id: tc
        uses: actions/cache@v4
        with:
          path: tools/toolchain/install
          key: cp2k-toolchain-ubuntu-v3

      - name: Install CP2K toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          cd tools/toolchain
          ./install_cp2k_toolchain.sh

      - name: Configure + build ssmp
        run: |
          source tools/toolchain/install/setup
          cmake -S . -B build-ssmp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCP2K_USE_EVERYTHING=ON \
            -DCP2K_USE_MPI=OFF \
            -DCP2K_USE_DLAF=OFF \
            -DCP2K_USE_PEXSI=OFF \
            -DCP2K_USE_OPENPMD=OFF \
            -DCP2K_USE_GAUXC=OFF \
            -DCP2K_USE_DEEPMD=OFF \
            -DCP2K_USE_LIBTORCH=OFF
          cmake --build build-ssmp -j 4

      - name: Configure + build psmp
        run: |
          source tools/toolchain/install/setup
          cmake -S . -B build-psmp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCP2K_USE_EVERYTHING=ON \
            -DCP2K_USE_DLAF=OFF \
            -DCP2K_USE_PEXSI=OFF \
            -DCP2K_USE_OPENPMD=OFF \
            -DCP2K_USE_GAUXC=OFF \
            -DCP2K_USE_DEEPMD=OFF \
            -DCP2K_USE_LIBTORCH=OFF
          cmake --build build-psmp -j 4

      - name: Show binaries
        run: |
          echo "-- ssmp --"; find build-ssmp -maxdepth 3 -type f -name 'cp2k*' 2>/dev/null | head
          echo "-- psmp --"; find build-psmp -maxdepth 3 -type f -name 'cp2k*' 2>/dev/null | head

      - name: Guard Gamma OT (H2O) - ssmp
        run: |
          export CP2K_DATA_DIR=$PWD/data
          BIN=$(find build-ssmp -maxdepth 3 -type f -name 'cp2k*' -executable | head -n1)
          (cd tests/QS/regtest-ot-1 && timeout 2400 "$BIN" H2O.inp > h2o.out 2>&1) || { echo "H2O ssmp failed"; tail -80 tests/QS/regtest-ot-1/h2o.out; exit 1; }
          grep -qiE 'PROGRAM ENDED|SCF run converged' tests/QS/regtest-ot-1/h2o.out || { echo "H2O ssmp did not converge"; tail -80 tests/QS/regtest-ot-1/h2o.out; exit 1; }

      - name: Guard Diamond K-point diag (c_3) - ssmp
        run: |
          export CP2K_DATA_DIR=$PWD/data
          BIN=$(find build-ssmp -maxdepth 3 -type f -name 'cp2k*' -executable | head -n1)
          (cd tests/QS/regtest-kp-1 && timeout 3000 "$BIN" c_3.inp > c3.out 2>&1) || { echo "c3 ssmp failed"; tail -80 tests/QS/regtest-kp-1/c3.out; exit 1; }
          grep -qiE 'PROGRAM ENDED|SCF run converged' tests/QS/regtest-kp-1/c3.out || { echo "c3 ssmp did not converge"; tail -80 tests/QS/regtest-kp-1/c3.out; exit 1; }

      - name: Guard Gamma OT (H2O) - psmp
        run: |
          export CP2K_DATA_DIR=$PWD/data
          BIN=$(find build-psmp -maxdepth 3 -type f -name 'cp2k*' -executable | head -n1)
          (cd tests/QS/regtest-ot-1 && timeout 2400 "$BIN" H2O.inp > h2o.out 2>&1) || { echo "H2O psmp failed"; tail -80 tests/QS/regtest-ot-1/h2o.out; exit 1; }
          grep -qiE 'PROGRAM ENDED|SCF run converged' tests/QS/regtest-ot-1/h2o.out || { echo "H2O psmp did not converge"; tail -80 tests/QS/regtest-ot-1/h2o.out; exit 1; }

      - name: Guard Diamond K-point diag (c_3) - psmp
        run: |
          export CP2K_DATA_DIR=$PWD/data
          BIN=$(find build-psmp -maxdepth 3 -type f -name 'cp2k*' -executable | head -n1)
          (cd tests/QS/regtest-kp-1 && timeout 3000 "$BIN" c_3.inp > c3.out 2>&1) || { echo "c3 psmp failed"; tail -80 tests/QS/regtest-kp-1/c3.out; exit 1; }
          grep -qiE 'PROGRAM ENDED|SCF run converged' tests/QS/regtest-kp-1/c3.out || { echo "c3 psmp did not converge"; tail -80 tests/QS/regtest-kp-1/c3.out; exit 1; }
